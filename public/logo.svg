<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenAGradient" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="85%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>

    <linearGradient id="lightningGrad" x1="110" y1="20" x2="150" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="80%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <radialGradient id="rimGrad" cx="100" cy="100" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4f4f5" />
      <stop offset="60%" stop-color="#71717a" />
      <stop offset="100%" stop-color="#27272a" />
    </radialGradient>

    <filter id="lightningGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#eab308" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- BACKGROUND SHAPE: Green Letter A -->
  <path d="M 100 15 L 180 175 L 135 175 L 118 135 L 82 135 L 65 175 L 20 175 Z M 100 60 L 88 102 L 112 102 Z" fill="url(#greenAGradient)" stroke="#14532d" stroke-width="3" stroke-linejoin="round" />
  <path d="M 100 15 L 180 175 L 160 175 L 100 38 L 40 175 L 20 175 Z" fill="#86efac" opacity="0.35" />

  <!-- CENTER TIRE / WHEEL -->
  <g transform="translate(100, 110)">
    <circle r="36" fill="#09090b" stroke="#27272a" stroke-width="2" />
    <circle r="33" fill="none" stroke="#3f3f46" stroke-width="3" stroke-dasharray="4 3" />
    <circle r="26" fill="none" stroke="url(#rimGrad)" stroke-width="3" />
    <circle r="23" fill="#18181b" />
    <path d="M -22 0 L 22 0 M 0 -22 L 0 22 M -15 -15 L 15 15 M -15 15 L 15 -15" stroke="#a1a1aa" stroke-width="1.5" opacity="0.75" />
    <circle r="8" fill="url(#rimGrad)" stroke="#09090b" stroke-width="1" />
    <circle r="3" fill="#ffffff" />
  </g>

  <!-- OVERLAY LIGHTNING BOLT -->
  <path d="M 130 15 L 90 95 L 118 95 L 70 185 L 150 82 L 118 82 Z" fill="url(#lightningGrad)" stroke="#78350f" stroke-width="2" stroke-linejoin="round" filter="url(#lightningGlow)" />
</svg>
